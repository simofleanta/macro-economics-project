name: Refresh data

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC daily = 06:00 Romania time (EET, winter) / 07:00 (EEST, summer)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_all.py

      - name: Commit refreshed chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/real-vs-nominal-data.json docs/inflation-regression-data.json docs/price-volume-data.json docs/heatmap-data.json docs/fiscal-deficit-data.json docs/pnrr-flows-data.json
          git diff --cached --quiet || git commit -m "Refresh chart data ($(date -u +%Y-%m-%d))"
          git push
